<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medical Claim Fraud Detector</title>
<style>
  :root {
    --bg: #f4f6fa; --panel: #fff; --text: #1d2433; --muted: #5b6475; --line: #dde2ea;
    --brand: #2453c7; --brand-d: #1b3f99; --ok: #1d7a46; --warn: #a86500; --high: #c2410c; --crit: #b91c1c;
    --low-bg: #e3f4ea; --med-bg: #fdf1d8; --high-bg: #fde4d6; --crit-bg: #fbdcdc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  a { color: var(--brand); }
  header { background: #13234d; color: #fff; display: flex; align-items: center; gap: 16px; padding: 10px 20px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .who { margin-left: auto; font-size: 13px; opacity: .9; display: flex; gap: 10px; align-items: center; }
  header button { background: transparent; color: #fff; border: 1px solid #ffffff66; }
  .layout { display: flex; min-height: calc(100vh - 48px); }
  nav { width: 210px; background: var(--panel); border-right: 1px solid var(--line); padding: 12px 0; flex-shrink: 0; }
  nav a { display: flex; justify-content: space-between; padding: 8px 18px; color: var(--text); text-decoration: none; }
  nav a:hover, nav a:focus { background: #eef2fb; outline: none; }
  nav a.active { background: #e3eafc; color: var(--brand-d); font-weight: 600; border-left: 3px solid var(--brand); padding-left: 15px; }
  nav .sec { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 12px 18px 4px; }
  main { flex: 1; padding: 20px 26px; min-width: 0; }
  h2 { margin: 0 0 14px; font-size: 20px; }
  h3 { margin: 18px 0 8px; font-size: 15px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .grid { display: grid; gap: 14px; }
  .g4 { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .kpi .v { font-size: 26px; font-weight: 700; }
  .kpi .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: #f8f9fc; }
  tr.click { cursor: pointer; }
  tr.click:hover, tr.click:focus { background: #f1f5fe; outline: none; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
  form.row, .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  input, select, textarea { font: inherit; padding: 6px 8px; border: 1px solid #b9c1cf; border-radius: 5px; background: #fff; color: var(--text); min-width: 120px; }
  textarea { min-height: 60px; width: 100%; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  button { font: inherit; padding: 7px 13px; border-radius: 5px; border: 1px solid var(--brand); background: var(--brand); color: #fff; cursor: pointer; }
  button:hover { background: var(--brand-d); }
  button.sec { background: #fff; color: var(--brand); }
  button.sec:hover { background: #eef2fb; }
  button.danger { background: var(--crit); border-color: var(--crit); }
  button.okb { background: var(--ok); border-color: var(--ok); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .LOW { background: var(--low-bg); color: var(--ok); }
  .MEDIUM { background: var(--med-bg); color: var(--warn); }
  .HIGH { background: var(--high-bg); color: var(--high); }
  .CRITICAL { background: var(--crit-bg); color: var(--crit); }
  .st { background: #e8ecf3; color: #334; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .bar { height: 10px; background: #e8ecf3; border-radius: 5px; overflow: hidden; flex: 1; }
  .bar > span { display: block; height: 100%; background: var(--brand); }
  .barrow { display: flex; align-items: center; gap: 10px; margin: 5px 0; }
  .barrow .lbl { width: 190px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barrow .val { width: 80px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  .score { font-size: 46px; font-weight: 800; }
  .flash { padding: 9px 12px; border-radius: 6px; margin-bottom: 12px; }
  .flash.err { background: var(--crit-bg); color: var(--crit); }
  .flash.ok { background: var(--low-bg); color: var(--ok); }
  pre { background: #0f1729; color: #d8e1f5; padding: 12px; border-radius: 6px; overflow: auto; max-height: 420px; font-size: 12px; }
  ul.factors { margin: 6px 0; padding-left: 20px; }
  ul.factors li { margin: 4px 0; }
  .login { max-width: 420px; margin: 60px auto; }
  .kv { display: grid; grid-template-columns: 170px 1fr; gap: 4px 12px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  .cm { border-collapse: collapse; width: auto; }
  .cm td, .cm th { border: 1px solid var(--line); text-align: center; padding: 8px 14px; }
  .sr { position: absolute; left: -9999px; }
  .pill { background: var(--crit); color: #fff; border-radius: 9px; font-size: 11px; padding: 0 6px; }
</style>
</head>
<body>
<header>
  <h1>Medical Claim Fraud &amp; Inflated Billing Detector</h1>
  <div class="who" id="who"></div>
</header>
<div class="layout">
  <nav id="nav" aria-label="Main navigation"></nav>
  <main id="main" tabindex="-1"><p class="muted">Loading...</p></main>
</div>
<div id="live" class="sr" aria-live="polite"></div>

<script>
"use strict";
// ---------------------------------------------------------------- core helpers
const S = { token: sessionStorage.getItem("fd.token"), role: sessionStorage.getItem("fd.role"), name: sessionStorage.getItem("fd.name"), userId: sessionStorage.getItem("fd.userId") };
const $main = document.getElementById("main");

/** Build a DOM element. Children may be strings (inserted as text, never HTML), nodes, arrays, or null. */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  const add = (c) => {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) c.forEach(add);
    else el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  };
  kids.forEach(add);
  return el;
}
function render(...nodes) { $main.replaceChildren(...nodes.flat().filter(Boolean)); $main.focus({ preventScroll: true }); }
function say(msg) { document.getElementById("live").textContent = msg; }
function flash(msg, ok) { return h("div", { class: "flash " + (ok ? "ok" : "err"), role: ok ? "status" : "alert" }, msg); }
function money(v) { if (v === null || v === undefined || v === "") return "-"; const n = Number(v); return isNaN(n) ? String(v) : n.toLocaleString(undefined, { maximumFractionDigits: 2 }); }
function pct(v) { return v === null || v === undefined ? "-" : (Number(v) * 100).toFixed(1) + "%"; }
function dt(v) { return v ? String(v).replace("T", " ").replace(/\.\d+Z$/, "Z") : "-"; }
function level(l) { return l ? h("span", { class: "badge " + l }, l) : h("span", { class: "muted" }, "not scored"); }
function status(s) { return s ? h("span", { class: "badge st" }, s) : "-"; }
function has(...roles) { return roles.includes(S.role); }

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (S.token) opts.headers.Authorization = "Bearer " + S.token;
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
  if (res.status === 401 && S.token && !path.startsWith("/api/auth")) { logout(); throw new Error("Session expired, please log in again."); }
  if (!res.ok) { const err = new Error((data && (data.error || data.message)) || ("HTTP " + res.status)); err.status = res.status; err.data = data; throw err; }
  return data;
}
async function guard(fn) {
  try { await fn(); } catch (e) { render(h("h2", {}, "Something went wrong"), flash(e.message)); }
}

/** Generic table: cols = [[header, row => cell], ...]. */
function table(rows, cols, onRow) {
  if (!rows || rows.length === 0) return h("p", { class: "muted" }, "No records.");
  return h("div", { class: "tablewrap" }, h("table", {},
    h("thead", {}, h("tr", {}, cols.map(c => h("th", { scope: "col" }, c[0])))),
    h("tbody", {}, rows.map(r => h("tr", onRow ? { class: "click", tabindex: "0", onclick: () => onRow(r), onkeydown: (e) => { if (e.key === "Enter") onRow(r); } } : {},
      cols.map(c => h("td", {}, c[1](r))))))));
}
function bars(items, labelOf, valueOf, fmt) {
  if (!items || items.length === 0) return h("p", { class: "muted" }, "No data.");
  const max = Math.max(...items.map(i => Number(valueOf(i)) || 0), 1e-9);
  return h("div", { role: "list" }, items.map(i => {
    const v = Number(valueOf(i)) || 0;
    return h("div", { class: "barrow", role: "listitem" },
      h("span", { class: "lbl", title: labelOf(i) }, labelOf(i)),
      h("span", { class: "bar", "aria-hidden": "true" }, h("span", { style: "width:" + (100 * v / max).toFixed(1) + "%" })),
      h("span", { class: "val" }, fmt ? fmt(v, i) : String(v)));
  }));
}
function field(label, input) { return h("label", {}, label, input); }
function inp(name, value, attrs) { return h("input", Object.assign({ name, value: value === undefined || value === null ? "" : value }, attrs || {})); }
function sel(name, options, value) { return h("select", { name }, options.map(o => { const [v, t] = Array.isArray(o) ? o : [o, o === "" ? "Any" : o]; return h("option", { value: v, selected: String(v) === String(value ?? "") }, t); })); }
function formData(form) { const o = {}; new FormData(form).forEach((v, k) => { o[k] = typeof v === "string" ? v.trim() : v; }); return o; }
function qs(o) { const p = new URLSearchParams(); Object.entries(o).forEach(([k, v]) => { if (v !== "" && v !== undefined && v !== null) p.set(k, v); }); const s = p.toString(); return s ? "?" + s : ""; }
function go(hash) { location.hash = hash; }
function back(label, hash) { return h("p", {}, h("a", { href: hash }, "\u2190 " + label)); }

// ---------------------------------------------------------------- auth
function saveSession(res, me) {
  Object.assign(S, { token: res.token, role: res.role, name: res.name, userId: me ? me.id : null });
  for (const k of ["token", "role", "name", "userId"]) S[k] ? sessionStorage.setItem("fd." + k, S[k]) : sessionStorage.removeItem("fd." + k);
}
function logout() {
  api("POST", "/api/auth/logout").catch(() => {});
  ["token", "role", "name", "userId"].forEach(k => { S[k] = null; sessionStorage.removeItem("fd." + k); });
  go("#/login"); route();
}
async function doLogin(email, password, errBox) {
  try {
    const res = await api("POST", "/api/auth/login", { email, password });
    S.token = res.token;
    const me = await api("GET", "/api/me");
    saveSession(res, me);
    go("#/dashboard"); route();
  } catch (e) { errBox.replaceChildren(flash(e.message)); }
}
function pageLogin() {
  const err = h("div");
  const demo = [["Admin", "admin@fraud.local", "admin123"], ["Claim officer", "officer@fraud.local", "officer123"],
    ["Investigator", "investigator@fraud.local", "investigate123"], ["Provider", "provider@fraud.local", "provider123"]];
  const form = h("form", { onsubmit: (e) => { e.preventDefault(); const d = formData(form); doLogin(d.email, d.password, err); } },
    h("div", { class: "grid" },
      field("Email", inp("email", "", { type: "email", required: true, autocomplete: "username" })),
      field("Password", inp("password", "", { type: "password", required: true, autocomplete: "current-password" })),
      h("button", { type: "submit" }, "Log in")));
  render(h("div", { class: "login" },
    h("div", { class: "panel" }, h("h2", {}, "Sign in"), err, form),
    h("div", { class: "panel" }, h("h3", { style: "margin-top:0" }, "Demo accounts (dev profile)"),
      h("p", { class: "muted small" }, "One click logs in with the seeded account."),
      h("div", { class: "row" }, demo.map(([label, e, p]) => h("button", { class: "sec", type: "button", onclick: () => doLogin(e, p, err) }, label))))));
}

// ---------------------------------------------------------------- navigation
const PAGES = [
  ["Overview", null],
  ["#/dashboard", "Dashboard", null],
  ["#/notifications", "Notifications", null],
  ["Claims", null],
  ["#/claims", "All claims", null],
  ["#/submit", "Submit claim", ["PROVIDER", "CLAIM_OFFICER", "ADMIN"]],
  ["#/high-risk", "High-risk claims", null],
  ["Fraud detection", null],
  ["#/investigations", "Investigations", ["INVESTIGATOR", "ADMIN", "CLAIM_OFFICER"]],
  ["#/model", "ML model", ["ADMIN", "CLAIM_OFFICER", "INVESTIGATOR"]],
  ["Registry", null],
  ["#/patients", "Patients", null],
  ["#/providers", "Providers", null],
  ["Analytics", null],
  ["#/reports", "Reports", ["ADMIN", "CLAIM_OFFICER"]],
  ["#/audit", "Audit log", ["ADMIN"]],
  ["Settings", null],
  ["#/users", "Users", ["ADMIN"]],
  ["#/profile", "Profile", null],
  ["#/console", "API console", null]
];
let unread = 0;
function drawNav() {
  const nav = document.getElementById("nav");
  const who = document.getElementById("who");
  if (!S.token) { nav.replaceChildren(); who.replaceChildren(); return; }
  const cur = location.hash.split("?")[0].split("/").slice(0, 2).join("/");
  const items = [];
  let pendingSection = null;
  for (const p of PAGES) {
    if (p.length === 2) { pendingSection = p[0]; continue; }
    const [hash, label, roles] = p;
    if (roles && !roles.includes(S.role)) continue;
    if (pendingSection) { items.push(h("div", { class: "sec" }, pendingSection)); pendingSection = null; }
    items.push(h("a", { href: hash, class: cur === hash ? "active" : null, "aria-current": cur === hash ? "page" : null }, label,
      hash === "#/notifications" && unread > 0 ? h("span", { class: "pill", "aria-label": unread + " unread" }, unread) : null));
  }
  nav.replaceChildren(...items);
  who.replaceChildren(h("span", {}, S.name + " \u00b7 " + S.role), h("button", { type: "button", onclick: logout }, "Log out"));
}
async function refreshUnread() {
  if (!S.token) return;
  try { const n = await api("GET", "/api/notifications?unread=true"); unread = (n || []).length; drawNav(); } catch (e) { /* ignore */ }
}

const ROUTES = {
  login: pageLogin, dashboard: pageDashboard, notifications: pageNotifications, claims: pageClaims, claim: pageClaim,
  submit: pageSubmit, edit: pageEdit, "high-risk": pageHighRisk, investigations: pageInvestigations, investigation: pageInvestigation,
  model: pageModel, patients: pagePatients, patient: pagePatient, providers: pageProviders, provider: pageProvider,
  reports: pageReports, audit: pageAudit, users: pageUsers, profile: pageProfile, console: pageConsole
};
function route() {
  const parts = (location.hash || "#/dashboard").slice(2).split("?")[0].split("/").map(decodeURIComponent);
  if (!S.token && parts[0] !== "login") { go("#/login"); return route(); }
  if (S.token && parts[0] === "login") { go("#/dashboard"); return route(); }
  drawNav();
  const fn = ROUTES[parts[0]] || pageDashboard;
  guard(() => fn(...parts.slice(1)));
}
window.addEventListener("hashchange", route);

// ---------------------------------------------------------------- dashboard
async function pageDashboard() {
  const d = await api("GET", "/api/dashboard");
  const k = d.kpis || {}, c = d.charts || {};
  render(h("h2", {}, "Dashboard"),
    h("div", { class: "grid g4" },
      [["Total claims", k.totalClaims], ["Flagged claims", k.flaggedClaims], ["High risk", k.highRiskClaims], ["Potential savings", money(k.potentialSavings)]]
        .map(([l, v]) => h("div", { class: "kpi" }, h("div", { class: "l" }, l), h("div", { class: "v" }, v ?? "-")))),
    h("div", { class: "grid g2", style: "margin-top:16px" },
      chart("Claims per month", c.claimsOverTimeByMonth, i => i.period, i => i.count),
      chart("Fraud trend (flagged per month)", c.fraudTrendByMonth, i => i.period, i => i.flagged, (v, i) => v + " / " + i.total),
      chart("Provider risk ranking", c.providerRiskRanking, i => i.providerName + " (" + i.providerId + ")", i => i.riskScore, v => v.toFixed(3)),
      chart("Claim amount distribution", c.claimAmountDistribution, i => i.bucket, i => i.count),
      chart("Fraud vs legitimate", c.fraudVsLegitimate, i => i.label, i => i.count),
      chart("High-risk procedures", c.highRiskProcedures, i => i.procedure, i => i.flagged, (v, i) => v + " / " + i.total),
      chart("Geographic distribution", c.geographicDistribution, i => i.location, i => i.count),
      chart("Claims per day (recent)", (c.claimsOverTimeByDay || []).slice(-12), i => i.period, i => i.count)));
}
function chart(title, items, l, v, fmt) { return h("div", { class: "panel" }, h("h3", { style: "margin-top:0" }, title), bars(items, l, v, fmt)); }

// ---------------------------------------------------------------- claims
const CLAIM_COLS = [
  ["Claim", r => r.claimId], ["Date", r => r.claimDate], ["Patient", r => r.patientId], ["Provider", r => r.providerId],
  ["Procedure", r => r.procedure], ["Amount", r => money(r.totalBilledAmount)],
  ["Risk", r => r.fraudAnalysis ? h("span", {}, level(r.fraudAnalysis.riskLevel), " ", String(r.fraudAnalysis.finalRiskScore)) : level(null)],
  ["Status", r => status(r.claimStatus)]
];
async function pageClaims() {
  const params = Object.fromEntries(new URLSearchParams(location.hash.split("?")[1] || ""));
  const form = h("form", { class: "row", onsubmit: (e) => { e.preventDefault(); go("#/claims?" + qs(formData(form)).slice(1)); } },
    field("Claim ID", inp("claimId", params.claimId)), field("Patient ID", inp("patientId", params.patientId)),
    field("Provider ID", inp("providerId", params.providerId)), field("Hospital", inp("hospital", params.hospital)),
    field("Diagnosis", inp("diagnosis", params.diagnosis)), field("Treatment", inp("procedure", params.procedure)),
    field("From", inp("dateFrom", params.dateFrom, { type: "date" })), field("To", inp("dateTo", params.dateTo, { type: "date" })),
    field("Risk level", sel("riskLevel", ["", "LOW", "MEDIUM", "HIGH", "CRITICAL"], params.riskLevel)),
    field("Investigation", sel("investigationStatus", ["", "NONE", "OPEN", "CLOSED"], params.investigationStatus)),
    field("Claim status", sel("status", ["", "SUBMITTED", "UNDER_INVESTIGATION", "APPROVED", "REJECTED", "ESCALATED", "DOCUMENTS_REQUESTED", "SUSPICIOUS"], params.status)),
    field("Page size", sel("size", ["20", "50", "100"], params.size || "50")),
    inp("page", "1", { type: "hidden" }),
    h("button", { type: "submit" }, "Search"), h("button", { type: "button", class: "sec", onclick: () => go("#/claims") }, "Reset"));
  const page = Number(params.page || 1);
  const rows = await api("GET", "/api/claims" + qs(Object.assign({}, params, { page })));
  const size = Number(params.size || 50);
  const pager = h("div", { class: "row", style: "margin-top:10px" },
    h("button", { class: "sec", disabled: page <= 1, onclick: () => go("#/claims?" + qs(Object.assign({}, params, { page: page - 1 })).slice(1)) }, "Previous"),
    h("span", { class: "muted" }, "Page " + page),
    h("button", { class: "sec", disabled: rows.length < size, onclick: () => go("#/claims?" + qs(Object.assign({}, params, { page: page + 1 })).slice(1)) }, "Next"));
  render(h("h2", {}, "All claims"), h("div", { class: "panel" }, form), table(rows, CLAIM_COLS, r => go("#/claim/" + encodeURIComponent(r.claimId))), pager);
}
async function pageHighRisk() {
  const rows = await api("GET", "/api/claims/high-risk");
  rows.sort((a, b) => (b.fraudAnalysis?.finalRiskScore || 0) - (a.fraudAnalysis?.finalRiskScore || 0));
  render(h("h2", {}, "High-risk claims (HIGH / CRITICAL)"), table(rows, CLAIM_COLS, r => go("#/claim/" + encodeURIComponent(r.claimId))));
}

async function pageClaim(id) {
  const c = await api("GET", "/api/claims/" + encodeURIComponent(id));
  const a = c.fraudAnalysis;
  const msg = h("div");
  const invs = has("INVESTIGATOR", "ADMIN", "CLAIM_OFFICER") ? await api("GET", "/api/investigations?claimId=" + encodeURIComponent(id)) : [];
  const actions = [];
  if (has("CLAIM_OFFICER", "ADMIN")) {
    const notes = inp("notes", "", { placeholder: "Notes (optional)" });
    const doReview = (action) => guardAction(msg, async () => { await api("POST", "/api/claims/" + encodeURIComponent(id) + "/review", { action, notes: notes.value }); say("Claim " + action.toLowerCase() + "d"); pageClaim(id); });
    actions.push(h("div", { class: "row" }, h("strong", {}, "Claim officer review:"), notes,
      h("button", { class: "okb", onclick: () => doReview("APPROVE") }, "Approve"),
      h("button", { class: "danger", onclick: () => doReview("REJECT") }, "Reject"),
      h("button", { class: "sec", onclick: () => doReview("ESCALATE") }, "Escalate to investigators")));
  }
  if (has("INVESTIGATOR", "ADMIN")) {
    const open = invs.find(i => i.status === "OPEN");
    actions.push(h("div", { class: "row", style: "margin-top:8px" }, h("strong", {}, "Investigation:"),
      open ? h("button", { onclick: () => go("#/investigation/" + open.investigationId) }, "Go to open investigation")
        : h("button", { onclick: () => guardAction(msg, async () => { const inv = await api("POST", "/api/investigations", { claimId: id, notes: "Opened from claim details" }); go("#/investigation/" + inv.investigationId); }) }, "Open investigation")));
  }
  if (has("PROVIDER", "CLAIM_OFFICER", "ADMIN") && ["SUBMITTED", "DOCUMENTS_REQUESTED"].includes(c.claimStatus)) {
    actions.push(h("div", { class: "row", style: "margin-top:8px" }, h("strong", {}, "Correction:"), h("button", { class: "sec", onclick: () => go("#/edit/" + encodeURIComponent(id)) }, "Correct claim information")));

  render(back("Providers", "#/providers"), h("h2", {}, p.providerName + " (" + p.providerId + ")"), msg,
    h("div", { class: "grid g2" },
      h("div", { class: "panel" }, h("div", { class: "kv" }, "Hospital", p.hospital || "-", "Location", p.location || "-", "Specialization", p.specialization || "-", "Claims", p.claimCount, "Average claim", money(p.averageClaim), "Flagged rate", pct(p.flaggedRate), "Risk score", Number(p.riskScore).toFixed(3))),
      report ? h("div", { class: "panel" }, h("h3", { style: "margin-top:0" }, "Provider report"), kvObject(report)) : null),
    edit ? h("div", { class: "panel" }, h("h3", { style: "margin-top:0" }, "Edit provider"), edit) : null,
    h("h3", {}, "Claims"), table(claims, CLAIM_COLS, r => go("#/claim/" + encodeURIComponent(r.claimId))));
}
function kvObject(o) {
  return h("div", { class: "kv" }, Object.entries(o).flatMap(([k, v]) => [k, v !== null && typeof v === "object" ? h("pre", { style: "margin:0;max-height:200px" }, JSON.stringify(v, null, 2)) : (v ?? "-")]));
}

// ---------------------------------------------------------------- reports
async function pageReports() {
  const out = h("div"), msg = h("div");
  const fa = await api("GET", "/api/reports/fraud-analytics");
  const claimForm = h("form", { class: "row", onsubmit: (e) => { e.preventDefault(); guardAction(msg, async () => { msg.replaceChildren(); const r = await api("GET", "/api/reports/claim/" + encodeURIComponent(formData(claimForm).id)); out.replaceChildren(reportPanel("Claim report", r)); }); } },
    field("Claim ID", inp("id", "", { required: true })), h("button", { type: "submit" }, "Claim report"));
  const provForm = h("form", { class: "row", onsubmit: (e) => { e.preventDefault(); guardAction(msg, async () => { msg.replaceChildren(); const r = await api("GET", "/api/reports/provider/" + encodeURIComponent(formData(provForm).id)); out.replaceChildren(reportPanel("Provider report", r)); }); } },
    field("Provider ID", inp("id", "PRV-001", { required: true })), h("button", { type: "submit" }, "Provider report"));
  render(h("h2", {}, "Reports"),
    h("div", { class: "grid g4" }, [["Total claims", fa.totalClaims], ["Suspicious claims", fa.suspiciousClaims], ["Fraud rate", pct(fa.fraudRate)], ["Potential billing inflation", money(fa.potentialBillingInflation)]]
      .map(([l, v]) => h("div", { class: "kpi" }, h("div", { class: "l" }, l), h("div", { class: "v" }, v ?? "-")))),
    h("div", { class: "grid g2", style: "margin-top:16px" },
      chart("Top risk providers (fraud rate)", fa.topRiskProviders, i => i.providerId, i => i.fraudRate, (v, i) => pct(v) + " (" + i.flaggedClaims + "/" + i.totalClaims + ")"),
      chart("Top risk treatments (flagged)", fa.topRiskTreatments, i => i.treatment, i => i.flaggedClaims, (v, i) => v + " / " + i.totalClaims),
      chart("Monthly trend (flagged)", fa.monthlyTrends, i => i.period, i => i.flagged, (v, i) => v + " / " + i.total)),
    h("div", { class: "panel" }, h("div", { class: "row" }, claimForm, provForm,
      h("button", { class: "sec", onclick: () => downloadJson("fraud-analytics-report.json", fa) }, "Download fraud analytics (JSON)"))),
    msg, out);
}
function reportPanel(title, r) {
  return h("div", { class: "panel" }, h("div", { class: "row" }, h("h3", { style: "margin:0" }, title), h("button", { class: "sec", onclick: () => downloadJson(title.toLowerCase().replace(/\s+/g, "-") + ".json", r) }, "Download JSON"), h("button", { class: "sec", onclick: () => window.print() }, "Print")), kvObject(r));
}
function downloadJson(name, obj) {
  const url = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" }));
  const a = h("a", { href: url, download: name }); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// ---------------------------------------------------------------- audit
async function pageAudit() {
  const rows = await api("GET", "/api/audit");
  const filter = new URLSearchParams(location.hash.split("?")[1] || "").get("action") || "";
  const actions = [...new Set(rows.map(r => r.action))].sort();
  const shown = filter ? rows.filter(r => r.action === filter) : rows;
  render(h("h2", {}, "Audit log"),
    h("div", { class: "panel row" }, field("Action", h("select", { onchange: (e) => go("#/audit" + qs({ action: e.target.value })) }, [h("option", { value: "" }, "All")].concat(actions.map(a => h("option", { value: a, selected: a === filter }, a))))),
      h("span", { class: "muted" }, shown.length + " entr" + (shown.length === 1 ? "y" : "ies"))),
    table(shown, [["When", r => dt(r.timestamp)], ["User", r => r.userId || "-"], ["Action", r => r.action], ["Target", r => r.targetId || "-"], ["IP", r => r.ip || "-"]]));
}

// ---------------------------------------------------------------- users / profile
async function pageUsers() {
  const rows = await api("GET", "/api/users");
  const msg = h("div");
  const roles = ["ADMIN", "CLAIM_OFFICER", "INVESTIGATOR", "PROVIDER"];
  const create = h("form", { class: "row", onsubmit: (e) => { e.preventDefault(); guardAction(msg, async () => { await api("POST", "/api/users", formData(create)); say("User created"); pageUsers(); }); } },
    field("Name", inp("name", "", { required: true })), field("Email", inp("email", "", { type: "email", required: true })),
    field("Password (min 8)", inp("password", "", { type: "password", minlength: "8", required: true, autocomplete: "new-password" })), field("Role", sel("role", roles, "CLAIM_OFFICER")), h("button", { type: "submit" }, "Create user"));
  const editRow = (u) => {
    const f = h("form", { class: "row", onsubmit: (e) => { e.preventDefault(); guardAction(msg, async () => { const d = formData(f); if (!d.password) delete d.password; await api("PATCH", "/api/users/" + encodeURIComponent(u.id), d); say("User updated"); pageUsers(); }); } },
      sel("role", roles, u.role), sel("status", ["ACTIVE", "DISABLED"], u.status), inp("password", "", { type: "password", placeholder: "New password (optional)", autocomplete: "new-password" }), h("button", { type: "submit", class: "sec" }, "Save"));
    return f;
  };
  render(h("h2", {}, "User management"), msg, h("div", { class: "panel" }, h("h3", { style: "margin-top:0" }, "Create user"), create),
    table(rows, [["Name", r => r.name], ["Email", r => r.email], ["Created", r => dt(r.createdAt)], ["Role / status / password", r => r.id === S.userId ? h("span", {}, status(r.role), " ", status(r.status), h("span", { class: "muted small" }, " (you)")) : editRow(r)]]));
}
async function pageProfile() {
  const me = await api("GET", "/api/me");
  const msg = h("div");
  const pw = h("form", { class: "row", onsubmit: (e) => { e.preventDefault(); guardAction(msg, async () => { await api("POST", "/api/me/password", formData(pw)); pw.reset(); msg.replaceChildren(flash("Password changed.", true)); }); } },
    field("Current password", inp("currentPassword", "", { type: "password", required: true, autocomplete: "current-password" })),
    field("New password (min 8)", inp("newPassword", "", { type: "password", required: true, minlength: "8", autocomplete: "new-password" })), h("button", { type: "submit" }, "Change password"));
  render(h("h2", {}, "Profile"), msg, h("div", { class: "panel" }, h("div", { class: "kv" }, "Name", me.name, "Email", me.email, "Role", me.role, "Status", me.status, "User ID", me.id, "Member since", dt(me.createdAt))),
    h("div", { class: "panel" }, h("h3", { style: "margin-top:0" }, "Change password"), pw));
}

// ---------------------------------------------------------------- API console
async function pageConsole() {
  const out = h("pre", {}, "Response appears here.");
  const examples = [["GET", "/api/health"], ["GET", "/api/dashboard"], ["GET", "/api/claims?riskLevel=HIGH&page=1&size=5"], ["GET", "/api/claims/high-risk"], ["GET", "/api/investigations?status=OPEN"],
    ["GET", "/api/notifications?unread=true"], ["GET", "/api/patients"], ["GET", "/api/providers"], ["GET", "/api/reports/fraud-analytics"], ["GET", "/api/ml/model"], ["GET", "/api/audit"], ["GET", "/api/users"], ["GET", "/api/me"]];
  const form = h("form", { onsubmit: async (e) => { e.preventDefault(); const d = formData(form); const t0 = performance.now();
    try { const opts = { method: d.method, headers: { Authorization: "Bearer " + S.token } }; if (d.body && d.method !== "GET") { opts.headers["Content-Type"] = "application/json"; opts.body = d.body; }
      const res = await fetch(d.path, opts); const text = await res.text(); let pretty = text; try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch (x) { /* raw */ }
      out.textContent = "HTTP " + res.status + "  (" + Math.round(performance.now() - t0) + " ms)\n\n" + pretty;
    } catch (err) { out.textContent = "Request failed: " + err.message; } } },
    h("div", { class: "row" }, field("Method", sel("method", ["GET", "POST", "PUT", "PATCH", "DELETE"], "GET")), h("label", { style: "flex:1" }, "Path", inp("path", "/api/dashboard", { style: "width:100%" })), h("button", { type: "submit" }, "Send")),
    field("JSON body (for POST / PUT / PATCH)", h("textarea", { name: "body", rows: "6" })));
  render(h("h2", {}, "API console"), h("p", { class: "muted" }, "Sends requests with your current token, so you can test any endpoint and role restriction directly."),
    h("div", { class: "panel" }, form, h("div", { class: "row", style: "margin-top:10px" }, examples.map(([m, p]) => h("button", { type: "button", class: "sec", onclick: () => { form.elements.method.value = m; form.elements.path.value = p; } }, m + " " + p)))), out);
}

route();
refreshUnread();
setInterval(refreshUnread, 30000);
